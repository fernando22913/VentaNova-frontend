<section class="mx-auto max-w-6xl px-4 py-8">
  <div class="max-w-2xl">
    <p class="eyebrow">Administración</p>
    <h1 class="mt-2 font-display text-3xl font-extrabold text-cream">Panel de administración</h1>
    <p class="mt-1.5 text-sm text-mist">
      Control total: catálogo, pedidos y gestión del equipo.
    </p>
  </div>

  <div
    class="mt-6 flex flex-wrap gap-1 rounded-xl border border-ink-800 bg-ink-900/60 p-1"
    role="tablist"
    aria-label="Secciones de administración"
  >
    <button
      type="button"
      role="tab"
      class="nav-link flex-1 justify-center"
      [class.nav-link-active]="tab() === 'catalog'"
      [attr.aria-selected]="tab() === 'catalog'"
      (click)="select('catalog')"
    >
      Catálogo
    </button>
    <button
      type="button"
      role="tab"
      class="nav-link flex-1 justify-center"
      [class.nav-link-active]="tab() === 'orders'"
      [attr.aria-selected]="tab() === 'orders'"
      (click)="select('orders')"
    >
      Pedidos
    </button>
    <button
      type="button"
      role="tab"
      class="nav-link flex-1 justify-center"
      [class.nav-link-active]="tab() === 'team'"
      [attr.aria-selected]="tab() === 'team'"
      (click)="select('team')"
    >
      Equipo
    </button>
  </div>

  <div class="mt-8">
    @switch (tab()) {
      @case ('catalog') {
        <app-catalog-manager />
      }
      @case ('orders') {
        <app-orders-table />
      }
      @case ('team') {
        <app-workers-manager />
      }
    }
  </div>
</section>
