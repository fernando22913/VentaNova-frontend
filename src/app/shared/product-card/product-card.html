<article
  class="group relative flex h-full flex-col overflow-hidden rounded-2xl border border-ink-800 bg-ink-900 transition duration-200 hover:border-acid-400/50 hover:shadow-[0_18px_40px_-24px_rgba(0,0,0,0.9)]"
>
  <a
    [routerLink]="['/catalog', product().slug]"
    class="relative block aspect-[16/10] overflow-hidden bg-ink-850"
    [attr.aria-label]="'Ver ' + product().title"
  >
    @if (product().coverImageUrl) {
      <img
        [src]="product().coverImageUrl ?? ''"
        [alt]="product().title"
        loading="lazy"
        class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.04]"
      />
    } @else {
      <div class="bg-dots grid h-full w-full place-items-center text-ink-500">
        <span class="font-mono text-[11px] uppercase tracking-[0.2em]">Sin portada</span>
      </div>
    }

    <div class="absolute inset-x-0 top-0 flex items-start justify-between gap-2 p-3">
      <span class="badge border-acid-400/40 bg-ink-950/80 text-acid-300 backdrop-blur">
        {{ typeLabels[product().type] }}
      </span>
      <span class="badge border-ink-700 bg-ink-950/80 text-mist backdrop-blur">
        {{ platformLabels[product().platform] }}
      </span>
    </div>
  </a>

  <div class="flex flex-1 flex-col gap-3 p-4">
    <a [routerLink]="['/catalog', product().slug]" class="block">
      <h3
        class="line-clamp-1 font-display text-base font-bold text-cream transition group-hover:text-acid-300"
      >
        {{ product().title }}
      </h3>
      <p class="mt-1.5 line-clamp-2 text-sm leading-relaxed text-mist">{{ product().summary }}</p>
    </a>

    <div class="mt-auto flex items-end justify-between gap-3 border-t border-ink-800 pt-4">
      <div>
        <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-ink-500">Precio</p>
        <p class="font-display text-xl font-extrabold text-cream">
          {{ product().priceCents | money }}
        </p>
      </div>
      <button type="button" class="btn btn-primary btn-sm" (click)="emitAddToCart()">
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 3h2l2.4 12.3a2 2 0 0 0 2 1.7h7.7a2 2 0 0 0 2-1.6L21 8H6" />
          <path d="M12 10v4M10 12h4" />
        </svg>
        Añadir
      </button>
    </div>
  </div>
</article>
