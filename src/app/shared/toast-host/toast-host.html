<div
  aria-live="polite"
  class="pointer-events-none fixed inset-x-4 bottom-4 z-50 flex flex-col items-stretch gap-2 sm:inset-x-auto sm:right-5 sm:w-full sm:max-w-sm"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="animate-rise pointer-events-auto flex items-start gap-3 rounded-xl border bg-ink-850 p-3.5 shadow-[0_20px_50px_-20px_rgba(0,0,0,0.9)]"
      [class]="
        toast.type === 'error'
          ? 'border-red-900/70'
          : toast.type === 'success'
            ? 'border-acid-500/40'
            : 'border-ink-700'
      "
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
    >
      <span
        class="mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-md"
        [class]="
          toast.type === 'error'
            ? 'bg-red-950 text-red-300'
            : toast.type === 'success'
              ? 'bg-acid-400/15 text-acid-300'
              : 'bg-ink-800 text-mist'
        "
        aria-hidden="true"
      >
        @if (toast.type === 'success') {
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        } @else if (toast.type === 'error') {
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M12 8v5M12 16h.01" />
            <circle cx="12" cy="12" r="9" />
          </svg>
        } @else {
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M12 8h.01M11 12h1v4h1" />
            <circle cx="12" cy="12" r="9" />
          </svg>
        }
      </span>

      <p class="flex-1 text-sm leading-snug text-cream">{{ toast.message }}</p>

      <button
        type="button"
        class="-m-1 grid h-6 w-6 shrink-0 place-items-center rounded-md text-ink-500 transition hover:bg-ink-800 hover:text-cream"
        (click)="dismiss(toast.id)"
        aria-label="Cerrar notificación"
      >
        <svg
          class="h-3.5 w-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </div>
  }
</div>
