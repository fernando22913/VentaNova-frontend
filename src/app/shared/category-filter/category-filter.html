<div
  class="mask-fade-x -mx-1 flex gap-2 overflow-x-auto px-1 pb-1"
  role="group"
  aria-label="Filtrar por categoría"
>
  <button
    type="button"
    class="chip"
    [class.chip-active]="selected() === ''"
    [attr.aria-pressed]="selected() === ''"
    (click)="select('')"
  >
    Todas
  </button>
  @for (category of categories(); track category.id) {
    <button
      type="button"
      class="chip"
      [class.chip-active]="selected() === category.slug"
      [attr.aria-pressed]="selected() === category.slug"
      (click)="select(category.slug)"
    >
      {{ category.name }}
    </button>
  }
</div>
